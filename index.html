<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner Calcio</title>
<style>
:root { --bg:#f2f2f7; --card:#fff; --blue:#007aff; --green:#2d7d32; --dark:#111; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  color: white;
  min-height: 100vh;
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.wrap { max-width: 500px; width: 100%; }
h1 {
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.subtitle {
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 2.5rem;
}
.card {
  display: block;
  padding: 1.5rem 1.25rem;
  margin: 1rem 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  text-decoration: none;
  color: white;
  transition: all .2s;
  backdrop-filter: blur(10px);
}
.card:hover, .card:active {
  background: rgba(255,255,255,0.14);
  transform: translateY(-2px);
}
.icon { font-size: 32px; display: block; margin-bottom: 6px; }
.title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.desc { font-size: 13px; color: #cbd5e1; }
.footer {
  text-align: center;
  margin-top: 2rem;
  color: #64748b;
  font-size: 11px;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ Scanner Calcio</h1>
  <div class="subtitle">V9.7 · Modello analitico proprietario</div>
  <a class="card" href="scanner.html">
    <span class="icon">🎯</span>
    <div class="title">Scanner V9.7</div>
    <div class="desc">Analisi partite e pronostici 1X2 / GG / Over-Under</div>
  </a>
  <a class="card" href="comparatore.html">
    <span class="icon">📊</span>
    <div class="title">Comparatore Backtest</div>
    <div class="desc">Confronto previsioni vs risultati reali</div>
  </a>
  <div class="footer">
    Aggiungi alla schermata Home per un'esperienza app-like
  </div>
</div>
</body>
</html>
